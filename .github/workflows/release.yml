name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Verify pyproject versions match the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          for f in pyproject.toml packages/zigpeek-offline/pyproject.toml; do
            v=$(grep -m1 -E '^version = ' "$f" | sed -E 's/.*"(.*)"/\1/')
            if [[ "$v" != "$tag" ]]; then
              echo "::error file=$f::version $v does not match tag $tag"
              exit 1
            fi
          done
          pin=$(grep -m1 -E 'zigpeek-offline==' pyproject.toml | sed -E 's/.*==([0-9][^"]*)".*/\1/')
          if [[ "$pin" != "$tag" ]]; then
            echo "::error file=pyproject.toml::offline pin $pin does not match tag $tag"
            exit 1
          fi

      - name: Build both wheels
        run: |
          uv build
          uv build --package zigpeek-offline

      - name: Verify wheels ship expected files
        run: |
          set -euo pipefail
          main=$(ls dist/zigpeek-*.whl | grep -v offline)
          off=$(ls dist/zigpeek_offline-*.whl)
          python -m zipfile -l "$main" | grep -q "_vendor/main.wasm"
          python -m zipfile -l "$off"  | grep -q "zigpeek_offline/.*/sources.tar"
          python -m zipfile -l "$off"  | grep -q "zigpeek_offline/.*/langref.html"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zigpeek
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: attach artifacts to GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            dist/*
